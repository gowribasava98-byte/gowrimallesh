name = "gowri-blog-publisher"
main = "src/index.js"
compatibility_date = "2026-10-23"

[vars]
GITHUB_OWNER = "gowribasava98-byte"
GITHUB_REPO = "gowrimallesh"
GITHUB_FILE_PATH = "index.html"
GITHUB_BRANCH = "main"
# Set this to your exact published site origin, e.g. https://gowribasava98-byte.github.io
ALLOWED_ORIGIN = "https://YOUR-GITHUB-USERNAME.github.io"
COMMIT_EMAIL = "blog-publisher@users.noreply.github.com"

[observability]
enabled = true

[secrets]
required = ["GITHUB_TOKEN", "ADMIN_PASSWORD", "SESSION_SIGNING_SECRET"]
